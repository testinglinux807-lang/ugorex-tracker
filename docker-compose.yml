version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: ugorex-db
    restart: always
    environment:
      POSTGRES_USER: ugorex_user
      POSTGRES_PASSWORD: ugorex_password
      POSTGRES_DB: ugorex
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ugorex-web
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://ugorex_user:ugorex_password@db:5432/ugorex"
      DIRECT_URL: "postgresql://ugorex_user:ugorex_password@db:5432/ugorex"
    env_file:
      - .env

  caddy:
    image: caddy:2-alpine
    container_name: ugorex-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
